<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #38bdf8; #818cf8; #06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Styles for CSS Keyframes Animation -->
    <style>
      .pulse-circle {
        animation: pulseAnim 3s ease-in-out infinite alternate;
      }
      .float-badge {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      @keyframes pulseAnim {
        0% { opacity: 0.35; r: 38px; }
        100% { opacity: 0.75; r: 44px; }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="260" rx="16" fill="url(#bgGradient)"/>
  <rect width="896" height="256" x="2" y="2" rx="15" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>

  <!-- Background Decorative Grid & Dots -->
  <g opacity="0.12">
    <path d="M 0,65 L 900,65 M 0,130 L 900,130 M 0,195 L 900,195" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,6"/>
    <path d="M 225,0 L 225,260 M 450,0 L 450,260 M 675,0 L 675,260" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,6"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="105" cy="130" r="40" fill="#38bdf8" opacity="0.25" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="800" cy="80" r="60" fill="#818cf8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="720" cy="200" r="45" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Left Icon: Database Cylinder Stack -->
  <g transform="translate(45, 65)">
    <path d="M 60,65 L 120,65 L 135,45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <circle cx="135" cy="45" r="3" fill="#38bdf8" opacity="0.8"/>
    
    <g class="float-badge">
      <path d="M 20,25 C 20,16 42,10 65,10 C 88,10 110,16 110,25 C 110,34 88,40 65,40 C 42,40 20,34 20,25 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 20,25 C 20,34 42,40 65,40 C 88,40 110,34 110,25 L 110,48 C 110,57 88,63 65,63 C 42,63 20,57 20,48 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 20,48 C 20,57 42,63 65,63 C 88,63 110,57 110,48 L 110,71 C 110,80 88,86 65,86 C 42,86 20,80 20,71 Z" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <path d="M 20,71 C 20,80 42,86 65,86 C 88,86 110,80 110,71 L 110,94 C 110,103 88,109 65,109 C 42,109 20,103 20,94 Z" fill="#090d16" stroke="#c084fc" stroke-width="2"/>
      
      <circle cx="35" cy="37" r="2.5" fill="#4ade80"/>
      <circle cx="35" cy="60" r="2.5" fill="#38bdf8"/>
      <circle cx="35" cy="83" r="2.5" fill="#fbbf24"/>
      <circle cx="45" cy="37" r="2" fill="#94a3b8" opacity="0.6"/>
      <circle cx="45" cy="60" r="2" fill="#94a3b8" opacity="0.6"/>
      <circle cx="45" cy="83" r="2" fill="#94a3b8" opacity="0.6"/>
    </g>
  </g>

  <!-- Center Content: Title, Badges, & Tagline -->
  <g transform="translate(200, 52)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85"/>
    <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">⚡ CURATED ECOSYSTEM</text>
    <circle cx="198" cy="13" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="66" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome SQL IDE &amp; Management
    </text>

    <text x="0" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="14.5" font-weight="500">
      The Ultimate Directory of SaaS Platforms, Open-Source Clients &amp; Query Tools
    </text>

    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="136" height="28" rx="7" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">💎 SaaS &amp; Commercial</text>

      <rect x="148" y="0" width="128" height="28" rx="7" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
      <text x="160" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🌟 Open-Source GUI</text>

      <rect x="288" y="0" width="138" height="28" rx="7" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
      <text x="300" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🔄 Multi-DB &amp; DevOps</text>

      <rect x="438" y="0" width="154" height="28" rx="7" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
      <text x="450" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">📊 Pricing &amp; Star Metrics</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="256" width="900" height="4" fill="url(#accentGradient)"/>
</svg>
